name = "easydb"
main = "src/index.ts"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]

# Hourly sweep that finalizes any downgrade-to-Free whose already-paid
# grace period has elapsed (see processExpiredDowngrades in src/auth.ts).
[triggers]
crons = ["0 * * * *"]

[vars]
AZURE_STORAGE_ACCOUNT = "smartlms"
AZURE_TABLE_NAME = "easydb"
AZURE_CONTAINER_NAME = "easydb-media-content"
GITHUB_CLIENT_ID = "Ov23liBLHEX473gWKB1V"
GITHUB_OAUTH_REDIRECT_URI = "https://easy-db.cloud/api/v1/auth/github/callback"
PAYPAL_CLIENT_ID = "AfY9OD9oWtaMgpLz8T-0zFqkBCJLaKmxNPrzN4ZBEvViKGUlCsskmgJBh2lEhHn3Jf4sZYXgYWt-NInQ"
PAYPAL_API_BASE = "https://api-m.sandbox.paypal.com"
PAYPAL_PLAN_DEVELOPER = "P-8SA72707W15873934NLLWPWY"
PAYPAL_PLAN_SCALE = "P-8US626098S416822GNLLWPXA"
PAYPAL_WEBHOOK_ID = "3H572543HX1959942"

[[d1_databases]]
binding = "DB"
database_name = "easydb-db"
database_id = "499657dc-64c8-4574-aaca-85f7f230798a"

# ── Cloudflare KV: raw API secret -> tenant context lookup ─────────────
# Create with: wrangler kv namespace create API_KEYS
# Then replace the id below with the id returned by that command.
[[kv_namespaces]]
binding = "API_KEYS"
id = "0cee87f3370b4fe8ac88b06f8c21441b"

# ── Cloudflare Worker Previews Configuration ──────────────────────────
# Allows branch preview deployments via `npx wrangler preview`
[previews.vars]
AZURE_STORAGE_ACCOUNT = "smartlms"
AZURE_TABLE_NAME = "easydb"
AZURE_CONTAINER_NAME = "easydb-media-content"
GITHUB_CLIENT_ID = "Ov23liBLHEX473gWKB1V"
GITHUB_OAUTH_REDIRECT_URI = "https://easy-db.cloud/api/v1/auth/github/callback"
PAYPAL_CLIENT_ID = "AfY9OD9oWtaMgpLz8T-0zFqkBCJLaKmxNPrzN4ZBEvViKGUlCsskmgJBh2lEhHn3Jf4sZYXgYWt-NInQ"
PAYPAL_API_BASE = "https://api-m.sandbox.paypal.com"
PAYPAL_PLAN_DEVELOPER = "P-8SA72707W15873934NLLWPWY"
PAYPAL_PLAN_SCALE = "P-8US626098S416822GNLLWPXA"
PAYPAL_WEBHOOK_ID = "3H572543HX1959942"

[[previews.d1_databases]]
binding = "DB"
database_name = "easydb-db"
database_id = "499657dc-64c8-4574-aaca-85f7f230798a"

[[previews.kv_namespaces]]
binding = "API_KEYS"
id = "0cee87f3370b4fe8ac88b06f8c21441b"

