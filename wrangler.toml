name = "easydb-local"
main = "src/index.ts"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "easydb-local-db"
database_id = "local-db-id"

[env.dev]
d1_databases = [
  { binding = "DB", database_name = "easydb-local-db", database_id = "local-db-id" }
]
